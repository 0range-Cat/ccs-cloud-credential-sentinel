# 云厂商凭据规则。字段语义见 docs/INTERFACES.md §4.2
- id: aws-access-key-id
  title: AWS Access Key ID
  type: aws_access_key_id
  vendor: aws
  version: 1
  license: MIT
  confidence: 80
  patterns:
    - '(?<![A-Za-z0-9])(AKIA|ASIA)[0-9A-Z]{16}(?![A-Za-z0-9])'
  min_length: 20
  max_length: 20
  known_examples:
    - AKIAIOSFODNN7EXAMPLE
    - ASIAIOSFODNN7EXAMPLE
    - AKIAABCDEFGHIJKLMNOP
  verifier: null
  tests:
    positives:
      - 'aws_access_key_id = AKIAQ5F2ZK7WLMXEDR9T'
      - 'export AWS_ACCESS_KEY_ID=ASIAQ5F2ZK7WLMXEDR9T'
    negatives:
      - 'key = AKIAIOSFODNN7EXAMPLE'
      - 'token = AKIA1234'

- id: aws-secret-access-key
  title: AWS Secret Access Key
  type: aws_secret_access_key
  vendor: aws
  version: 1
  license: MIT
  confidence: 60
  patterns:
    - '(?<![A-Za-z0-9/+=])([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
  secret_group: 1
  min_length: 40
  max_length: 40
  min_entropy: 3.0
  required_context:
    - '(?i)secret[_-]?access[_-]?key'
    - '(?i)aws_secret'
    - '(?i)(aws|amazon)[^\n]{0,30}(secret|sk)[^\n]{0,10}key'
  forbidden_context:
    - 'EXAMPLE'
  pairing: { with: aws-access-key-id, max_line_distance: 5, boost: 20 }
  tests:
    positives:
      - 'aws_secret_access_key = k7Rq2Xm9ZvBs4YwLd8Hn3Jp6TfG1QeAu5Ci0OxVy'
    negatives:
      - 'k7Rq2Xm9ZvBs4YwLd8Hn3Jp6TfG1QeAu5Ci0OxVy'
      - 'aws_secret_access_key = xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'

- id: aliyun-access-key-id
  title: 阿里云 AccessKey ID
  type: aliyun_access_key_id
  vendor: aliyun
  version: 1
  license: MIT
  confidence: 75
  patterns:
    - '(?<![A-Za-z0-9])(LTAI)[A-Za-z0-9]{12,20}(?![A-Za-z0-9])'
  min_length: 16
  max_length: 24
  tests:
    positives:
      - 'access_key_id = LTAI5tA1b2C3d4E5f6G7'
    negatives:
      - 'key = LTAI123'

- id: aliyun-access-key-secret
  title: 阿里云 AccessKey Secret
  type: aliyun_access_key_secret
  vendor: aliyun
  version: 1
  license: MIT
  confidence: 60
  patterns:
    - '(?<![A-Za-z0-9])([A-Za-z0-9]{30})(?![A-Za-z0-9])'
  secret_group: 1
  min_length: 30
  max_length: 30
  min_entropy: 3.0
  required_context:
    - '(?i)access[_-]?key[_-]?secret'
  pairing: { with: aliyun-access-key-id, max_line_distance: 5, boost: 10 }
  tests:
    positives:
      - 'access_key_secret = 7yG1xJ9kQ2wL5vB8nM4cR6tZ0aS3dF'
    negatives:
      - '7yG1xJ9kQ2wL5vB8nM4cR6tZ0aS3dF'

- id: tencent-secret-id
  title: 腾讯云 SecretId
  type: tencent_secret_id
  vendor: tencent
  version: 1
  license: MIT
  confidence: 75
  patterns:
    - '(?<![A-Za-z0-9])(AKID)[A-Za-z0-9]{13,40}(?![A-Za-z0-9])'
  min_length: 17
  max_length: 44
  tests:
    positives:
      - 'SecretId = AKIDz8krbsJ5yKBZQpn74WFkmLPx5E'
    negatives:
      - 'id = AKID123'

- id: tencent-secret-key
  title: 腾讯云 SecretKey
  type: tencent_secret_key
  vendor: tencent
  version: 1
  license: MIT
  confidence: 60
  patterns:
    - '(?<![A-Za-z0-9])([A-Za-z0-9]{32})(?![A-Za-z0-9])'
  secret_group: 1
  min_length: 32
  max_length: 32
  min_entropy: 3.0
  required_context:
    - '(?i)secret[_-]?key'
    - '(?i)(qcloud|tencent)'
  pairing: { with: tencent-secret-id, max_line_distance: 5, boost: 10 }
  tests:
    positives:
      - 'SecretKey = Gh5kX2pQ8wLn4Vb7cM1zR9tY0aJ3dF6s'
    negatives:
      - 'Gh5kX2pQ8wLn4Vb7cM1zR9tY0aJ3dF6s'

- id: azure-storage-account-key
  title: Azure 存储账户密钥
  type: azure_storage_account_key
  vendor: azure
  version: 1
  license: MIT
  confidence: 80
  patterns:
    - 'AccountKey=([A-Za-z0-9+/=]{60,})'
  secret_group: 1
  min_length: 60
  max_length: 200
  required_context:
    - '(?i)(core\.windows\.net|AccountName|azure)'
  tests:
    positives:
      - 'DefaultEndpointsProtocol=https;AccountName=stdemoacc;AccountKey=5x7Yz9A2b4C6d8E0f1G2h3J4k5L6m7N8o9P0q1R2s3T4u5V6w7X8y9Z0a1B2c3D4e5F6g7H8i9J0k1L2mN4o6Pq==;EndpointSuffix=core.windows.net'
    negatives:
      - 'AccountKey=5x7Yz9A2b4C6d8E0f1G2h3J4k5L6m7N8o9P0q1R2s3T4u5V6w7X8y9Z0a1B2c3D4e5F6g7H8i9J0k1L2mN4o6Pq=='

- id: azure-ad-client-secret
  title: Azure AD 客户端密钥
  type: azure_ad_client_secret
  vendor: azure
  version: 1
  license: MIT
  confidence: 75
  patterns:
    - '(?i)client_secret["'']?\s*[:=]\s*["'']([A-Za-z0-9~._-]{30,})["'']'
  secret_group: 1
  min_length: 30
  tests:
    positives:
      - '"client_secret": "qW7Y~8zA.bC_dE-fG9hI0jK1lM2nO3pQ4rS5"'
    negatives:
      - '"client_secret": "your_client_secret_here"'

- id: gcp-service-account-json
  title: GCP 服务账号 JSON
  type: gcp_service_account_json
  vendor: google
  version: 1
  license: MIT
  confidence: 95
  patterns: ['service_account']
  structured: gcp_service_account
  tests:
    positives:
      - '{"type": "service_account", "project_id": "demo-project", "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQ\n-----END PRIVATE KEY-----\n", "client_email": "svc@demo-project.iam.gserviceaccount.com"}'
    negatives:
      - '{"type": "authorized_user", "client_secret": "Ab12Cd34Ef56Gh78Ij90Kl12Mn34"}'
